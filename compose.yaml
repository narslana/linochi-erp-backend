# Local development (NFK-16). The passwords are only valid on this machine.
#
# Keep the Postgres tag in step with the cluster and internal/platform/testdb:
# the CNPG cluster runs ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie.
#
# RustFS is added together with the first feature that stores files.
services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      # The superuser of this local server. The app never uses it: db/dev/initdb
      # creates the owner and app roles and the database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, when the volume is empty. After changing it: docker compose down -v
      - ./db/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linochi_erp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
