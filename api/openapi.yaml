      operationId: archiveReminder
      tags: [reminders]
      summary: Archive a reminder (REG-05)
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The archived reminder.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/reminders/{id}/notify:
    post:
      operationId: markReminderNotified
      tags: [reminders]
      summary: Mark a reminder as notified (REG-05)
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reminder marked as notified.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"

  /api/v1/ean-series:
    get:
      operationId: listEANSeries
      tags: [ids]
      summary: List all EAN series (REG-04)
      security:
        - session: []
      responses:
        "200":
          description: All EAN series.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EANSeries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: registerEANSeries
      tags: [ids]
      summary: Register a new EAN series (REG-04)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEANSeries"
      responses:
        "201":
          description: The new EAN series.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EANSeries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-linochi_erp_session
      description: |
        The session cookie, set by `/auth/callback`. A write from another origin
        is refused with 403 whatever the cookie says.

  responses:
    Unauthenticated:
      description: |
        There is no usable session: no cookie, or one that is unknown, ended or
        for an archived user. The answer never says which. A cookie that is no
        good is cleared.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginForbidden:
      description: A request from another origin. Nothing was changed.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InsufficientStock:
      description: >-
        The reservation or withdrawal would take the available or batch quantity
        below zero (LAG-02). Nothing was written.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvalidMovement:
      description: >-
        The movement is wrong: zero or negative quantity, a movement type that
        has its own endpoint, or a manual adjustment without a reason (LAG-04).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request body is invalid.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource was not found.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VersionConflict:
      description: The version number is stale (optimistic locking).
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

