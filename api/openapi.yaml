        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/kiosk/pair:
    post:
      operationId: pairKioskDevice
      tags: [kiosk]
      summary: Pair a kiosk device with its pairing code (KIO-06)
      security: []
      parameters:
        - name: pairing_code
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 1 }
      responses:
        "200":
          description: Paired. Returns read-only session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401":
          description: Not approved or invalid key.
          content:
