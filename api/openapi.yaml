openapi: 3.1.0
info:
  title: Linochi ERP API
  version: 0.1.0
  description: |
    The API of Linochi ERP. The web app and, later, n8n call it.

    Errors are `application/problem+json` (RFC 9457). The `type` of a problem is
    `https://erp.lab.internal/problems/<code>`, and the codes are stable once
    published. Every problem carries a `trace_id` that finds the request in Loki
    and Tempo.

    Login is the authorization code flow with PKCE against Authelia, done by the
    backend: the browser never sees a token, only the session cookie.
servers:
  - url: https://erp.lab.internal
tags:
  - name: auth
    description: Login, logout and who is logged in
  - name: boards
    description: Kanban boards, columns, cards, checklists and comments (TAV-01 to TAV-07)
  - name: products
    description: Products, field definitions, product types and documents (PRD-01 to PRD-19)
  - name: ids
    description: Numbers and IDs registry (REG-01 to REG-03)
  - name: suppliers
    description: Suppliers and contacts (LEV-01 to LEV-03)
  - name: purchasing
    description: Purchase orders and lines (INK-01, INK-04)
  - name: shipments
    description: Shipments linked to purchase orders (INK-02, INK-03, INK-05)
  - name: inventory
    description: Locations, stock movements and balance (LAG-01 to LAG-05)
  - name: calendar
    description: iCal calendar sources and events (KAL-01 to KAL-04)
  - name: kiosk
    description: Kiosk playlists, views and devices (KIO-01 to KIO-07)
  - name: customers
    description: Customers, contacts and leads (KUN-01 to KUN-08)
  - name: workflow
    description: Workflow steps, transitions, conditions and effects (WF-01 to WF-10)
  - name: orders
    description: Orders and order lines (ORD-01 to ORD-13)
  - name: stats
    description: Statistics and key figures (STA-01 to STA-04)
  - name: reminders
    description: Reminders for expiring entries (REG-05)

paths:
  /api/v1/boards:
    get:
      operationId: listBoards
      tags: [boards]
      summary: List all boards (TAV-01)
      security:
        - session: []
      responses:
        "200":
          description: All active boards.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createBoard
      tags: [boards]
      summary: Create a board (TAV-01)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "201":
          description: The new board with default columns.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/boards/{board_id}:
    get:
      operationId: getBoard
      tags: [boards]
      summary: Get a board by ID
      security:
        - session: []
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The board.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBoard
      tags: [boards]
      summary: Update a board name (TAV-01)
      security:
        - session: []
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                version:
                  type: integer
      responses:
        "200":
          description: The updated board.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
    delete:
      operationId: archiveBoard
      tags: [boards]
      summary: Archive a board (NFK-09)
      security:
        - session: []
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The archived board.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/boards/{board_id}/columns:
    get:
      operationId: listColumns
      tags: [boards]
      summary: List columns for a board (TAV-02)
      security:
        - session: []
      parameters:
        - name: board_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
