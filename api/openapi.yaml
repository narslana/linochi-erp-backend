        "200":
          description: Aggregated data for all view types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskData"
        "401":
          description: Invalid or unapproved API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-linochi_erp_session
      description: |
        The session cookie, set by `/auth/callback`. A write from another origin
        is refused with 403 whatever the cookie says.

  responses:
    Unauthenticated:
      description: |
        There is no usable session: no cookie, or one that is unknown, ended or
        for an archived user. The answer never says which. A cookie that is no
        good is cleared.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginForbidden:
      description: A request from another origin. Nothing was changed.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request body is invalid.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource was not found.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VersionConflict:
      description: The version number is stale (optimistic locking).
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

