    put:
      operationId: updateKioskDevice
      tags: [kiosk]
      summary: Update a kiosk device (KIO-06)
      security:
        - session: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 128 }
                approved: { type: boolean }
                playlist_id: { type: string, format: uuid }
                expires_at: { type: string, format: date-time }
                version: { type: integer }
      responses:
        "200":
          description: The updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskDevice"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: archiveKioskDevice
