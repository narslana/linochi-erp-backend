  /api/v1/version:
    get:
      operationId: getVersion
      tags: [auth]
      summary: Which release is running
      description: |
        The version and commit this build was made from, for the menu of the web
        app (INS-07). For people who are logged in.
      security:
        - session: []
      responses:
        "200":
          description: The running release.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
