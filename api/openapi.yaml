    InventoryValue:
      type: object
      required: [location_id, product_id, product_name, in_stock, value]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        in_stock: { type: integer }
        value: { type: integer }
    Version:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
          description: The release, for instance `0.1.0`. `dev` for a build outside CI.
          examples: ["0.1.0"]
        commit:
          type: string
          description: The short commit the build was made from.
          examples: ["6ed201b"]
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: "`https://erp.lab.internal/problems/<code>`"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The path of the request, never its query.
        trace_id:
          type: string

    ICalSource:
      type: object
      required: [id, name, ical_url, sync_interval, enabled, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        name_en: { type: string }
        ical_url: { type: string }
        color: { type: string }
        sync_interval: { type: integer }
        enabled: { type: boolean }
        archived_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CalendarEvent:
      type: object
      required: [id, source_type, title, start_time, end_time, all_day, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_type:
          type: string
          enum: [ical, internal]
        source_id: { type: string, format: uuid }
        ical_uid: { type: string }
        title: { type: string }
        description: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        all_day: { type: boolean }
        color: { type: string }
        erp_link_type: { type: string }
        erp_link_id: { type: string, format: uuid }
        archived_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KioskPlaylist:
      type: object
      required: [id, name, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        name_en: { type: string }
        archived_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KioskPlaylistView:
      type: object
      required: [id, playlist_id, view_type, sort_order, duration_sec, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        playlist_id: { type: string, format: uuid }
        view_type:
          type: string
          enum: [map, graph, inventory, orders, calendar]
        sort_order: { type: integer }
        duration_sec: { type: integer }
        settings:
          type: object
          additionalProperties: true
        archived_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KioskDevice:
      type: object
      required: [id, name, pairing_code, approved, lan_only, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        pairing_code: { type: string }
        approved: { type: boolean }
        playlist_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        lan_only: { type: boolean }
        archived_at: { type: string, format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KioskData:
      type: object
      description: Aggregated data for kiosk views.
      properties:
        orders_per_month:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              orders: { type: integer }
              revenue: { type: integer }
        revenue_by_channel:
          type: array
          items:
            type: object
            properties:
              channel: { type: string }
              revenue: { type: integer }
        key_figures:
          type: object
          properties:
            orders_this_year: { type: integer }
            revenue_this_year: { type: integer }
            countries: { type: integer }
            customers: { type: integer }
        inventory_value:
          type: integer
        low_stock_count: { type: integer }
